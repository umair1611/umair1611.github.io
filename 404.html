<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — GarbageP2P</title>
<style>
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#0e3b26;color:#eafaf1;
       min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
  .box{padding:40px}
  h1{font-size:5rem;margin:0;color:#f5a524}
  p{color:#bfe7d2}
  a{display:inline-block;margin-top:16px;background:#27c281;color:#06231a;font-weight:700;
    text-decoration:none;padding:12px 26px;border-radius:10px}
</style>
</head>
<body>
  <div class="box">
    <div style="font-size:3rem">♻️</div>
    <h1>404</h1>
    <p>That page got recycled. Let's get you back.</p>
    <a id="home" href="index.html">← Back to GarbageP2P</a>
  </div>
  <script>
    // Resolve the project root so this works at any GitHub Pages path.
    var seg = location.pathname.split('/').filter(Boolean);
    var root = (location.hostname.endsWith('github.io') && seg.length) ? '/' + seg[0] + '/' : '/';
    document.getElementById('home').setAttribute('href', root);
  </script>
</body>
</html>
