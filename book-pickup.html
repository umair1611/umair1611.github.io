<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Pickup — GarbageP2P</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/img/favicon.svg">
</head>
<body data-page="book-pickup">
<noscript><div class="noscript-warn">This demo needs JavaScript enabled.</div></noscript>
<div id="gp-header"></div>

<main class="gp-main">
  <div class="gp-hero py-5">
    <div class="container">
      <h1 class="mb-2">🚚 Book a doorstep scrap pickup</h1>
      <p class="lead mb-0">Don't want to negotiate? Schedule a pickup and (in the full product) our team comes to weigh and pay on the spot.</p>
    </div>
  </div>

  <div class="container py-5" id="wrap">
    <div class="row g-4">
      <div class="col-lg-4">
        <h5 class="fw-bold mb-3">How it works</h5>
        <div id="steps"></div>
        <div class="gp-card p-3 bg-soft-green mt-4"><div class="fw-bold">📞 Prefer to call?</div><div class="small text-muted-2">0331 7777722</div></div>
      </div>
      <div class="col-lg-8">
        <div class="gp-card p-4 p-md-5">
          <form id="book-form" class="row g-3">
            <div class="col-md-6"><label class="form-label required">Your name</label><input id="b_name" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label required">Phone</label><input id="b_phone" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Email</label><input type="email" id="b_email" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Scrap type</label><select id="b_cat" class="form-select"><option value="">Mixed / not sure</option></select></div>
            <div class="col-12"><label class="form-label required">Pickup address</label><input id="b_address" class="form-control" placeholder="House/Street, Area, City" required></div>
            <div class="col-12">
              <label class="form-label d-flex justify-content-between"><span>Pin your location on the map</span>
                <button type="button" id="b_use_current" class="btn btn-sm btn-outline-success py-0">📍 Use my current location</button></label>
              <div id="book-map" class="gp-map map-md"></div>
              <input type="hidden" id="b_lat"><input type="hidden" id="b_lng">
            </div>
            <div class="col-md-6"><label class="form-label">Preferred date</label><input type="date" id="b_date" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Time slot</label><select id="b_slot" class="form-select"><option>Morning</option><option>Afternoon</option><option>Evening</option></select></div>
            <div class="col-12"><label class="form-label">Notes</label><input id="b_notes" class="form-control" placeholder="e.g. 3rd floor, ring the bell"></div>
            <div class="col-12"><button class="btn btn-success btn-lg w-100 fw-semibold">Request pickup</button></div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="gp-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/maps.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(async function () {
  await Store.ready;
  const prof = Store.profile();
  if (prof) { GP.qs('#b_name').value = prof.name; }
  GP.qs('#b_cat').innerHTML += Store.categories().map(c => `<option value="${c.id}">${c.icon} ${GP.esc(c.name)}</option>`).join('');
  GP.qs('#b_date').min = new Date().toISOString().slice(0, 10);
  GP.qs('#b_date').value = new Date(Date.now() + 86400e3).toISOString().slice(0, 10);

  const steps = [['Select', 'Choose your scrap type and tell us where to come.'], ['Schedule', 'Pick a date and a Morning / Afternoon / Evening slot.'], ['Inspect', 'Our team weighs everything on calibrated digital scales.'], ['Get paid', 'Receive cash or transfer before we load up.']];
  GP.qs('#steps').innerHTML = steps.map((s, i) =>
    `<div class="d-flex gap-3 mb-3"><div class="step-num flex-shrink-0">${i + 1}</div><div><div class="fw-bold">${s[0]}</div><div class="small text-muted-2">${s[1]}</div></div></div>`).join('');

  gpLocationPicker({ mapId: 'book-map', latInput: '#b_lat', lngInput: '#b_lng', addressInput: '#b_address', useCurrentBtn: '#b_use_current' });

  GP.qs('#book-form').addEventListener('submit', e => {
    e.preventDefault();
    const name = GP.qs('#b_name').value.trim(), phone = GP.qs('#b_phone').value.trim(), addr = GP.qs('#b_address').value.trim();
    if (name.length < 3 || phone.length < 7 || !addr) { GP.toast('Please fill name, phone and address.', 'error'); return; }
    const catId = GP.qs('#b_cat').value;
    Store.addBooking({
      name, phone, email: GP.qs('#b_email').value.trim(),
      category_id: catId ? Number(catId) : null, category_name: catId ? Store.catById(Number(catId)).name : 'Mixed',
      address: addr, lat: GP.qs('#b_lat').value || null, lng: GP.qs('#b_lng').value || null,
      preferred_date: GP.qs('#b_date').value, time_slot: GP.qs('#b_slot').value, notes: GP.qs('#b_notes').value.trim()
    });
    GP.qs('#wrap').innerHTML = `<div class="gp-card p-5 text-center mx-auto" style="max-width:560px">
      <div style="font-size:3rem">✅</div><h3 class="fw-bold">Pickup request saved!</h3>
      <p class="text-muted-2">Thanks ${GP.esc(name)}. In this demo your booking is stored in your browser — see it under <a href="dashboard.html">My Activity</a>. The full product would call you on <strong>${GP.esc(phone)}</strong> to confirm your pickup.</p>
      <a href="index.html" class="btn btn-success">Back to home</a> <a href="dashboard.html" class="btn btn-outline-success">My activity</a></div>`;
    GP.toast('Booking saved to your browser.', 'success');
  });
})();
</script>
</body>
</html>
