<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketplace — GarbageP2P</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/img/favicon.svg">
</head>
<body data-page="marketplace">
<noscript><div class="noscript-warn">This demo needs JavaScript enabled.</div></noscript>
<div id="gp-header"></div>

<main class="gp-main">
  <div class="bg-soft-green py-4">
    <div class="container">
      <h1 class="section-title mb-1">Scrap marketplace</h1>
      <p class="text-muted-2 mb-0">Browse live buy &amp; sell requests. Locations on the map — <span class="legend-dot dot-pickup"></span>pickup point, <span class="legend-dot dot-live"></span>live location.</p>
    </div>
  </div>

  <div class="container py-4">
    <div class="row g-4">
      <div class="col-lg-3">
        <form class="gp-card p-3 sticky-top" style="top:90px" id="filters">
          <h6 class="fw-bold mb-3">Filter</h6>
          <input type="text" name="q" id="f-q" class="form-control mb-3" placeholder="Search…">
          <label class="form-label small fw-semibold">I want to see</label>
          <select name="type" id="f-type" class="form-select mb-3">
            <option value="">Everything</option>
            <option value="sell">♻️ Trash for sale</option>
            <option value="buy">🏭 Buyers wanted</option>
          </select>
          <label class="form-label small fw-semibold">Category</label>
          <select name="category" id="f-cat" class="form-select mb-3"><option value="">All categories</option></select>
          <label class="form-label small fw-semibold">Sort by</label>
          <select name="sort" id="f-sort" class="form-select mb-3">
            <option value="new">Newest first</option>
            <option value="price_high">Price: high to low</option>
            <option value="price_low">Price: low to high</option>
          </select>
          <button class="btn btn-success w-100" type="submit">Apply filters</button>
          <a href="marketplace.html" class="btn btn-link w-100 text-muted-2">Reset</a>
        </form>
      </div>

      <div class="col-lg-9">
        <div id="market-map" class="gp-map map-md mb-4"></div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="text-muted-2"><strong id="count">0</strong> requests found</span>
          <a href="post-request.html" class="btn btn-sm btn-success"><i class="bi bi-plus-lg"></i> Post a request</a>
        </div>
        <div class="row g-4" id="results"></div>
      </div>
    </div>
  </div>
</main>

<div id="gp-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/maps.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(async function () {
  await Store.ready;
  const p = new URLSearchParams(location.search);
  const type = p.get('type') || '', cat = p.get('category') || '', q = p.get('q') || '', sort = p.get('sort') || 'new';

  // populate filter controls
  GP.qs('#f-cat').innerHTML += Store.categories().map(c => `<option value="${c.id}">${c.icon} ${GP.esc(c.name)}</option>`).join('');
  GP.qs('#f-q').value = q; GP.qs('#f-type').value = type; GP.qs('#f-cat').value = cat; GP.qs('#f-sort').value = sort;

  const list = Store.requests({ openOnly: true, type, category: cat, q, sort });
  GP.qs('#count').textContent = list.length;
  GP.qs('#results').innerHTML = list.length
    ? list.map(r => `<div class="col-md-6 col-xl-4">${GP.requestCard(r)}</div>`).join('')
    : '<div class="col-12"><div class="gp-card p-5 text-center text-muted-2">No requests match your filters. <a href="post-request.html">Post one →</a></div></div>';

  // map points
  const points = [];
  list.forEach(r => {
    const label = `<strong>${GP.esc(r.title)}</strong><br>${r.proposed_price != null ? GP.money(r.proposed_price) + '/' + r.price_unit : 'Open price'}<br><a href="request.html?id=${encodeURIComponent(r.id)}">View request →</a>`;
    if (r.pickup_lat && r.pickup_lng) points.push({ lat: +r.pickup_lat, lng: +r.pickup_lng, type: 'pickup', label });
    else if (r.current_lat && r.current_lng) points.push({ lat: +r.current_lat, lng: +r.current_lng, type: 'live', label });
  });
  gpRenderMap('market-map', points, { scroll: false, zoom: 11 });
})();
</script>
</body>
</html>
